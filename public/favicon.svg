<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>
    <linearGradient id="emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" stroke="#27272a" stroke-width="8" />
  
  <!-- Vinyl Grooves -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#27272a" stroke-width="4" stroke-dasharray="8 6" />
  <circle cx="256" cy="256" r="150" fill="none" stroke="#27272a" stroke-width="4" stroke-dasharray="12 8" />
  <circle cx="256" cy="256" r="110" fill="none" stroke="#27272a" stroke-width="3" />
  
  <!-- Center Glow & Disc Center -->
  <circle cx="256" cy="256" r="75" fill="url(#emerald)" filter="url(#glow)" opacity="0.3" />
  <circle cx="256" cy="256" r="70" fill="url(#emerald)" />
  <circle cx="256" cy="256" r="24" fill="#09090b" />
  <circle cx="256" cy="256" r="10" fill="#34d399" />
  
  <!-- Dynamic Audio Waves / Equalizer Lines -->
  <path d="M120 256 A136 136 0 0 1 256 120" fill="none" stroke="#34d399" stroke-width="14" stroke-linecap="round" />
  <path d="M392 256 A136 136 0 0 1 256 392" fill="none" stroke="#10b981" stroke-width="14" stroke-linecap="round" />
</svg>
